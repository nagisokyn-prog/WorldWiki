[http]
check-revoke = false
timeout = 60

[net]
retry = 5
git-fetch-with-cli = true

[alias]
cov = "llvm-cov nextest --workspace"
cov-html = "llvm-cov nextest --workspace --html --open"
test-all = "nextest run --workspace"

[build]
rustc-wrapper = "sccache"

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "linker=lld-link.exe"]

