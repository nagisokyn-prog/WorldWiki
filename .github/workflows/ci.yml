name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false


      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            tauri-surreal-kit
            vendor/claw-code/rust

      - name: Install Node dependencies
        run: pnpm install

      - name: Build Project
        run: pnpm build

      - name: Run Frontend Tests
        run: pnpm test

      - name: Cargo Check & Clippy
        run: |
          cargo check
          cargo clippy -- -D warnings
        working-directory: src-tauri

      - name: Run Backend Tests
        run: cargo test
        working-directory: src-tauri

      - name: Run Claw-Code Tests
        run: cargo test
        working-directory: vendor/claw-code/rust

      - name: Run Llama-Turboquant-Cpp Tests
        run: |
          cmake -B build
          cmake --build build --parallel 2
          cd build && ctest --output-on-failure
        working-directory: vendor/llama-turboquant-cpp