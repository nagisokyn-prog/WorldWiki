name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf cmake

      - name: Install Node dependencies
        run: pnpm install

      - name: Build Project
        run: pnpm build

      - name: Run Frontend Tests
        run: pnpm test

      - name: Cargo Check & Clippy
        run: |
          cargo check
          cargo clippy -- -D warnings
        working-directory: src-tauri

      - name: Run Backend Tests
        run: cargo test
        working-directory: src-tauri

      - name: Run Claw-Code Tests
        run: cargo test
        working-directory: vendor/claw-code/rust

      - name: Run Llama-Turboquant-Cpp Tests
        run: |
          mkdir -p build && cd build
          cmake ..
          make -j2
          ctest --output-on-failure
        working-directory: vendor/llama-turboquant-cpp