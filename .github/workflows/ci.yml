name: CI

on:
  push:
    branches: [ '**' ] 

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false


      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            tauri-surreal-kit
            vendor/claw-code/rust

      - name: Install Node dependencies
        run: pnpm install

      - name: Build Project
        run: pnpm build

      - name: Run Frontend Tests
        run: pnpm test

      - name: Cargo Check & Clippy
        run: |
          cargo check
          cargo clippy -- -D warnings
        working-directory: src-tauri

      - name: Run Backend Tests
        run: cargo test
        working-directory: src-tauri

      - name: Run Claw-Code Tests
        run: cargo test
        working-directory: vendor/claw-code/rust

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Run Llama-Turboquant-Cpp Tests
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="/w" -DCMAKE_CXX_FLAGS="/w"
          cmake --build build --config Release --parallel
          cmake --build build --config Release --target test-arg-parser test-quantize-fns
          ctest --test-dir build -C Release -L main -E "(test-backend-ops|test-json-partial)" --output-on-failure
        working-directory: vendor/llama-turboquant-cpp