<!doctype html>
<html lang="ru" style="background-color: #0f1117; color: #f0f6fc;">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>World Wiki Ultimate</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0f1117;
        color: #f0f6fc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        height: 100%;
        overflow: hidden;
      }
      .initial-splash-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0f1117;
        color: rgba(255, 255, 255, 0.7);
        font-size: 13px;
        z-index: 99999;
      }
      .initial-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(139, 92, 246, 0.2);
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: initialSpin 0.8s linear infinite;
      }
      @keyframes initialSpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="bg-glow top-left"></div>
    <div class="bg-glow bottom-right"></div>

    <div id="app" class="app-container-new" v-cloak>
      <div class="initial-splash-loader">
        <div class="initial-spinner"></div>
        <span>Инициализация WorldWiki...</span>
      </div>
    </div>
    <!-- end #app -->

    <script>
      window.__APP_CONFIG__ = {
        id: "world-wiki",
        name: "World Wiki",
        storageKey: "world-wiki:settings",
      };
    </script>
    <script type="module" src="/src/ts/app/app.ts"></script>
  </body>
</html>
