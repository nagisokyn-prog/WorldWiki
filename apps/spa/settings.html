<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>World Wiki - Настройки</title>
    
    <link rel="stylesheet" href="@worldwiki/resources/styles/fonts.css">
    <link href="@worldwiki/resources/styles/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="@worldwiki/resources/styles/glass-theme.css">
    <link rel="stylesheet" href="@worldwiki/resources/styles/glass-animations.css">
    <link rel="stylesheet" href="@worldwiki/resources/styles/modules/settings.css">
    
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 0; background: var(--bg-base, #09090b); height: 100vh; overflow: hidden; }
      
      /* Верхняя панель */
      .settings-topbar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10001;
        height: 60px; display: flex; align-items: center; justify-content: space-between;
        padding: 0 24px;
        background: var(--bg-panel, rgba(15,15,18,0.9));
        backdrop-filter: blur(var(--glass-blur, 24px));
        border-bottom: 1px solid var(--border-color, rgba(255,255,255,0.1));
      }
      .settings-topbar h1 {
        margin: 0; font-size: 18px; color: var(--text-main, #fff);
      }
      .topbar-actions { display: flex; gap: 12px; align-items: center; }
      .btn-save {
        padding: 8px 24px; border-radius: 40px; cursor: pointer;
        background: var(--accent, #8b5cf6); color: var(--accent-text, #fff); border: none;
        font-size: 14px; font-weight: 600; transition: all 0.3s;
      }
      .btn-save:hover { background: var(--accent-hover, #7c3aed); }
      .btn-back {
        padding: 8px 16px; border-radius: 40px; cursor: pointer;
        background: transparent; color: var(--text-main, #fff);
        border: 1px solid var(--border-color, rgba(255,255,255,0.1));
        font-size: 14px; transition: all 0.3s;
      }
      .btn-back:hover { border-color: var(--accent, #8b5cf6); color: var(--accent, #8b5cf6); }
      
      /* Контейнер для Settings Vue (с отступом под topbar) */
      #settingsContent {
        margin-top: 60px;
        height: calc(100vh - 60px);
        overflow: hidden;
        display: flex;
      }
      
      /* Settings компонент занимает всю высоту */
      .settings-container {
        width: 100%;
        height: 100%;
      }
      
      .bg-glow { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.15; pointer-events: none; }
      .bg-glow.top-left { width: 400px; height: 400px; top: -100px; left: -100px; background: var(--accent, #8b5cf6); }
      .bg-glow.bottom-right { width: 500px; height: 500px; bottom: -150px; right: -150px; background: #3b82f6; }
    </style>
</head>
<body>
    <div class="bg-glow top-left"></div>
    <div class="bg-glow bottom-right"></div>
    
    <!-- Верхняя панель -->
    <div class="settings-topbar">
        <h1>⚙️ Настройки UI</h1>
        <div class="topbar-actions">
            <button class="btn-save" id="saveBtn">💾 Сохранить</button>
            <button class="btn-back" onclick="window.location.href='project_launcher.html'">← Назад</button>
        </div>
    </div>
    
    <!-- Контейнер для SettingsModal -->
    <div id="settingsContent"></div>
    
    <!-- Performance styles -->
    <style id="perfStyles"></style>
    <script>
        (async function () {
            const perfLevel = localStorage.getItem('perfLevel');
            if (perfLevel === 'low') {
                document.getElementById('perfStyles').textContent = `
                    * {
                        backdrop-filter: none !important;
                        -webkit-backdrop-filter: none !important;
                    }
                    .bg-glow {
                        display: none !important;
                    }
                `;
                console.log('🎨 Applied client-side low performance styles fallback');
            }
            if (perfLevel && window.__TAURI__?.core) {
                try {
                    const css = await window.__TAURI__.core.invoke('get_performance_styles', { level: perfLevel });
                    document.getElementById('perfStyles').textContent = css;
                    console.log(`🎨 Applied performance styles from Rust: ${perfLevel}`);
                } catch (e) {
                    console.warn('⚠️ Could not load performance styles:', e);
                }
            }
        })();
    </script>
    <script type="module" src="/src/ts/app/settings.ts"></script>
</body>
</html>
