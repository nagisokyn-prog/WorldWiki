[workspace]
members = [
    "cerberus-domain",
    "cerberus-ports",
    "cerberus-application",
    "cerberus-infrastructure",
    "cargo-cerberus",
    "cerberus-sfc",
    "cerberus-surql",
    "cerberus-testability",
]
exclude = [
    "cargo-cerberus/tests/fixtures/valid_clean_hexagonal",
    "cargo-cerberus/tests/fixtures/invalid_domain_imports",
    "cargo-cerberus/tests/fixtures/invalid_mutex_await",
    "cargo-cerberus/tests/fixtures/taint_depth_3",
]
resolver = "2"

[profile.dev]
opt-level = 1
debug = 1
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
