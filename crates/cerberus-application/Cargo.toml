[package]
name = "cerberus-application"
version = "1.0.0"
edition = "2021"
authors = ["Danila"]
description = "Application Use Cases for Architectural Firewall (ARCH-002 compliant: zero UI/Tauri dependencies)"

[package.metadata.cerberus]
layer = "application"

[dependencies]
cerberus-domain = { path = "../cerberus-domain" }
cerberus-ports = { path = "../cerberus-ports" }
chrono = { version = "0.4", default-features = false }
hmac = "0.13.0"
sha2 = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.8"


