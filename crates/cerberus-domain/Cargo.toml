[package]
name = "arch-guard-domain"
version = "0.1.0"
edition = "2021"
authors = ["Danila"]
description = "Pure Domain model for Architectural Firewall (ARCH-001 compliant: 0 framework SDKs)"

[package.metadata.arch-guard]
layer = "domain"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
chrono = { version = "0.4", features = ["serde"] }

