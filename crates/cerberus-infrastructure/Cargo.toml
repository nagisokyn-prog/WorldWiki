[package]
name = "cerberus-infrastructure"
version = "1.0.0"
edition = "2021"
authors = ["Danila"]
description = "Concrete infrastructure adapters (Syn AST, Vue SFC, Keyring, JSON/SARIF) for Architectural Firewall"

[package.metadata.cerberus]
layer = "infrastructure"

[dependencies]
cerberus-domain = { path = "../cerberus-domain" }
cerberus-ports = { path = "../cerberus-ports" }
cerberus-surql = { path = "../cerberus-surql" }
syn = { version = "3.0.5", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
petgraph = "0.8.3"
keyring = "4.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "3.1.1"
regex = "1.10"
walkdir = "2.4"
fs2 = "0.4"
rayon = "1.8"
cargo_metadata = "0.23.1"
semver = "1.0"

[dev-dependencies]
tempfile = "3.8"
indoc = "2.0"





