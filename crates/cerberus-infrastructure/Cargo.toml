[package]
name = "arch-guard-infrastructure"
version = "0.1.0"
edition = "2021"
authors = ["Danila"]
description = "Concrete infrastructure adapters (Syn AST, Vue SFC, Keyring, JSON/SARIF) for Architectural Firewall"

[package.metadata.arch-guard]
layer = "infrastructure"

[dependencies]
arch-guard-domain = { path = "../arch-guard-domain" }

arch-guard-ports = { path = "../arch-guard-ports" }
syn = { version = "3.0.5", features = ["full", "visit", "extra-traits"] }
proc-macro2 = "1.0"
quote = "1.0"
petgraph = "0.8.3"
keyring = "4.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "3.1.1"
regex = "1.10"
walkdir = "2.4"
fs2 = "0.4"
rayon = "1.8"
cargo_metadata = "0.23.1"

[dev-dependencies]
tempfile = "3.8"





