<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 680" width="1440" height="680" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
  <defs>
    <!-- Accent Royal Blue Arrowhead for Property Graph TYPE RELATION edges -->
    <marker id="graph-arrow" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 1 L 11 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>

    <!-- Crow's Foot: Mandatory One (|) at line start -->
    <marker id="one-start" viewBox="0 0 14 14" refX="0" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <line x1="6" y1="2" x2="6" y2="12" stroke="#64748b" stroke-width="1.5"/>
    </marker>

    <!-- Crow's Foot: Optional One (o|) at line start -->
    <marker id="opt-one-start" viewBox="0 0 20 14" refX="0" refY="7" markerWidth="16" markerHeight="12" orient="auto-start-reverse">
      <line x1="5" y1="2" x2="5" y2="12" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="12.5" cy="7" r="3.2" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/>
    </marker>

    <!-- Crow's Foot: Zero or Many (o<) at line end -->
    <marker id="many-opt-end" viewBox="0 0 22 14" refX="21" refY="7" markerWidth="18" markerHeight="12" orient="auto">
      <circle cx="5.5" cy="7" r="3.2" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/>
      <line x1="9" y1="7" x2="21" y2="7" stroke="#64748b" stroke-width="1.3"/>
      <line x1="21" y1="2" x2="11" y2="7" stroke="#64748b" stroke-width="1.4"/>
      <line x1="21" y1="12" x2="11" y2="7" stroke="#64748b" stroke-width="1.4"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #ffffff; }

    /* Color-coded cards by 3 domains (no cluttering domain frames!) */
    .card-project { fill: #fef3c7; stroke: #b45309; stroke-width: 2.3; rx: 6; ry: 6; }
    .card-project-inner { fill: none; stroke: #d97706; stroke-width: 1; rx: 4; ry: 4; }

    .card-manuscript { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.85; rx: 6; ry: 6; }
    .card-hub { fill: #ffedd5; stroke: #c2410c; stroke-width: 2.4; rx: 6; ry: 6; }
    .card-hub-inner { fill: none; stroke: #ea580c; stroke-width: 1; rx: 4; ry: 4; }

    .card-lore { fill: #ecfdf5; stroke: #059669; stroke-width: 1.85; rx: 6; ry: 6; }
    .card-chrono { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.85; rx: 6; ry: 6; }

    .entity-title { font-size: 16px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .entity-sub { font-size: 12px; font-weight: 400; fill: #334155; text-anchor: middle; }

    .graph-edge { fill: none; stroke: #1d4ed8; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .rel-edge { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 5 3; stroke-linejoin: round; stroke-linecap: round; }
    .crossing-halo { fill: none; stroke: #ffffff; stroke-width: 7; stroke-linecap: butt; }

    .label-bg { fill: #ffffff; fill-opacity: 0.95; stroke: none; rx: 3; ry: 3; }
    .graph-label { font-family: 'Consolas', 'DejaVu Sans Mono', monospace; font-size: 12.5px; font-weight: 700; fill: #1e3a8a; text-anchor: middle; }
    .rel-label { font-size: 12px; font-style: italic; fill: #475569; text-anchor: middle; }
    .legend-text { font-size: 12.5px; font-weight: 500; fill: #1e293b; }
  </style>

  <rect class="bg" x="0" y="0" width="1440" height="680"/>

  <!-- =================================================================== -->
  <!-- LAYER 1: RELATIONAL 1:N & 0..1:N EDGES (GRAY DASHED + CROW'S FOOT)  -->
  <!-- =================================================================== -->

  <!-- projects 1:N story_arcs (outer-left corridor) -->
  <path class="rel-edge" d="M 885 70 L 885 26 L 26 26 L 26 284 L 70 284"
        marker-start="url(#one-start)" marker-end="url(#many-opt-end)"/>
  <rect class="label-bg" x="509" y="17" width="52" height="16"/>
  <text class="rel-label" x="535" y="29">задаёт</text>

  <!-- projects 1:N planets -->
  <path class="rel-edge" d="M 1000 104 L 1120 104"
        marker-start="url(#one-start)" marker-end="url(#many-opt-end)"/>
  <rect class="label-bg" x="1026" y="95" width="68" height="16"/>
  <text class="rel-label" x="1060" y="107">включает</text>

  <!-- projects 1:N entity_schemas -->
  <path class="rel-edge" d="M 885 138 L 885 250"
        marker-start="url(#one-start)" marker-end="url(#many-opt-end)"/>
  <rect class="label-bg" x="844" y="185" width="82" height="16"/>
  <text class="rel-label" x="885" y="197">определяет</text>

  <!-- volumes 0..1:N todos -->
  <path class="rel-edge" d="M 420 104 L 300 104"
        marker-start="url(#opt-one-start)" marker-end="url(#many-opt-end)"/>
  <rect class="label-bg" x="336" y="95" width="48" height="16"/>
  <text class="rel-label" x="360" y="107">имеет</text>

  <!-- story_arcs 0..1:N todos -->
  <path class="rel-edge" d="M 185 250 L 185 138"
        marker-start="url(#opt-one-start)" marker-end="url(#many-opt-end)"/>
  <rect class="label-bg" x="147" y="185" width="76" height="16"/>
  <text class="rel-label" x="185" y="197">порождает</text>

  <!-- chapters 0..1:N todos -->
  <path class="rel-edge" d="M 420 268 L 360 268 L 360 124 L 300 124"
        marker-start="url(#opt-one-start)" marker-end="url(#many-opt-end)"/>
  <rect class="label-bg" x="331" y="185" width="58" height="16"/>
  <text class="rel-label" x="360" y="197">требует</text>

  <!-- todos 0..1:N todos (зависит от) -->
  <path class="rel-edge" d="M 145 70 L 145 42 L 225 42 L 225 70"
        marker-start="url(#opt-one-start)" marker-end="url(#many-opt-end)"/>
  <rect class="label-bg" x="148" y="32" width="74" height="16"/>
  <text class="rel-label" x="185" y="44">зависит от</text>

  <!-- chapters 1:N text_blocks (содержит) -->
  <path class="rel-edge" d="M 535 318 L 535 430"
        marker-start="url(#one-start)" marker-end="url(#many-opt-end)"/>
  <rect class="label-bg" x="498" y="365" width="74" height="16"/>
  <text class="rel-label" x="535" y="377">содержит</text>

  <!-- entity_schemas 1:N entities (типизирует) -->
  <path class="rel-edge" d="M 885 318 L 885 430"
        marker-start="url(#one-start)" marker-end="url(#many-opt-end)"/>
  <rect class="label-bg" x="845" y="388" width="80" height="16"/>
  <text class="rel-label" x="885" y="400">типизирует</text>

  <!-- planets 1:N calendars -->
  <path class="rel-edge" d="M 1245 138 L 1245 250"
        marker-start="url(#one-start)" marker-end="url(#many-opt-end)"/>
  <rect class="label-bg" x="1207" y="185" width="76" height="16"/>
  <text class="rel-label" x="1245" y="197">формирует</text>

  <!-- calendars 1:N timeline_events -->
  <path class="rel-edge" d="M 1245 318 L 1245 430"
        marker-start="url(#one-start)" marker-end="url(#many-opt-end)"/>
  <rect class="label-bg" x="1212" y="365" width="66" height="16"/>
  <text class="rel-label" x="1245" y="377">датирует</text>

  <!-- plot_promises 0..1:N plot_promises (детализирует) -->
  <path class="rel-edge" d="M 96 498 L 96 534 L 154 534 L 154 498"
        marker-start="url(#opt-one-start)" marker-end="url(#many-opt-end)"/>
  <rect class="label-bg" x="81" y="538" width="88" height="16"/>
  <text class="rel-label" x="125" y="550">детализирует</text>

  <!-- =================================================================== -->
  <!-- LAYER 2: PROPERTY GRAPH EDGES (ACCENT ROYAL BLUE)                   -->
  <!-- =================================================================== -->

  <!-- projects -> volumes :CONTAINS -->
  <path class="graph-edge" d="M 770 104 L 653 104"
        marker-end="url(#graph-arrow)"/>
  <rect class="label-bg" x="666" y="95" width="88" height="18"/>
  <text class="graph-label" x="710" y="108">:CONTAINS</text>

  <!-- volumes -> chapters :CONTAINS -->
  <path class="graph-edge" d="M 535 138 L 535 247"
        marker-end="url(#graph-arrow)"/>
  <rect class="label-bg" x="491" y="185" width="88" height="18"/>
  <text class="graph-label" x="535" y="198">:CONTAINS</text>

  <!-- chapters -> story_arcs :ADVANCES_ARC -->
  <path class="graph-edge" d="M 420 296 L 303 296"
        marker-end="url(#graph-arrow)"/>
  <rect class="label-bg" x="304" y="287" width="114" height="18"/>
  <text class="graph-label" x="361" y="300">:ADVANCES_ARC</text>

  <!-- plot_promises -> story_arcs :ADVANCES_ARC -->
  <path class="graph-edge" d="M 185 430 L 185 321"
        marker-end="url(#graph-arrow)"/>
  <rect class="label-bg" x="126" y="365" width="118" height="18"/>
  <text class="graph-label" x="185" y="378">:ADVANCES_ARC</text>

  <!-- plot_promises -> text_blocks :PROMISE_MILESTONES -->
  <path class="graph-edge" d="M 300 464 L 417 464"
        marker-end="url(#graph-arrow)"/>
  <rect class="label-bg" x="282" y="455" width="156" height="18"/>
  <text class="graph-label" x="360" y="468">:PROMISE_MILESTONES</text>

  <!-- timeline_events -> chapters :REVEALED_IN (white bridge at x=885) -->
  <path class="crossing-halo" d="M 875 372 L 895 372"/>
  <path class="graph-edge" d="M 1160 430 L 1160 372 L 610 372 L 610 321"
        marker-end="url(#graph-arrow)"/>
  <rect class="label-bg" x="1006" y="363" width="108" height="18"/>
  <text class="graph-label" x="1060" y="376">:REVEALED_IN</text>

  <!-- entities -> text_blocks :APPEARS_IN -->
  <path class="graph-edge" d="M 770 464 L 653 464"
        marker-end="url(#graph-arrow)"/>
  <rect class="label-bg" x="658" y="455" width="104" height="18"/>
  <text class="graph-label" x="710" y="468">:APPEARS_IN</text>

  <!-- entities -> timeline_events :PARTICIPATES_IN -->
  <path class="graph-edge" d="M 1000 464 L 1117 464"
        marker-end="url(#graph-arrow)"/>
  <rect class="label-bg" x="992" y="455" width="136" height="18"/>
  <text class="graph-label" x="1060" y="468">:PARTICIPATES_IN</text>

  <!-- entities -> entities :ENTITY_REL (bottom self-loop) -->
  <path class="graph-edge" d="M 915 498 L 915 538 L 975 538 L 975 501"
        marker-end="url(#graph-arrow)"/>
  <rect class="label-bg" x="898" y="544" width="94" height="18"/>
  <text class="graph-label" x="945" y="557">:ENTITY_REL</text>

  <!-- entities -> plot_promises :PARTICIPANT_OF -->
  <path class="graph-edge" d="M 845 498 L 845 554 L 245 554 L 245 501"
        marker-end="url(#graph-arrow)"/>
  <rect class="label-bg" x="476" y="545" width="128" height="18"/>
  <text class="graph-label" x="540" y="558">:PARTICIPANT_OF</text>

  <!-- plot_promises -> timeline_events :OCCURS_AT -->
  <path class="graph-edge" d="M 205 498 L 205 602 L 1245 602 L 1245 501"
        marker-end="url(#graph-arrow)"/>
  <rect class="label-bg" x="660" y="593" width="100" height="18"/>
  <text class="graph-label" x="710" y="606">:OCCURS_AT</text>

  <!-- =================================================================== -->
  <!-- LAYER 3: 12 COLOR-CODED CARDS IN 4x3 HORIZONTAL GRID                -->
  <!-- =================================================================== -->

  <!-- Row 1 -->
  <g>
    <rect class="card-manuscript" x="70" y="70" width="230" height="68"/>
    <text class="entity-title" x="185" y="99">todos</text>
    <text class="entity-sub" x="185" y="120">Задачи планировщика (3NF)</text>
  </g>
  <g>
    <rect class="card-manuscript" x="420" y="70" width="230" height="68"/>
    <text class="entity-title" x="535" y="99">volumes</text>
    <text class="entity-sub" x="535" y="120">Тома произведения</text>
  </g>
  <g>
    <rect class="card-project" x="770" y="70" width="230" height="68"/>
    <rect class="card-project-inner" x="774" y="74" width="222" height="60"/>
    <text class="entity-title" x="885" y="99">projects</text>
    <text class="entity-sub" x="885" y="120">Проект мира / Произведение</text>
  </g>
  <g>
    <rect class="card-chrono" x="1120" y="70" width="250" height="68"/>
    <text class="entity-title" x="1245" y="99">planets</text>
    <text class="entity-sub" x="1245" y="120">Планеты: сутки, наклон, луны</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect class="card-manuscript" x="70" y="250" width="230" height="68"/>
    <text class="entity-title" x="185" y="279">story_arcs</text>
    <text class="entity-sub" x="185" y="300">Сквозные сюжетные арки</text>
  </g>
  <g>
    <rect class="card-manuscript" x="420" y="250" width="230" height="68"/>
    <text class="entity-title" x="535" y="279">chapters</text>
    <text class="entity-sub" x="535" y="300">Главы рукописи (AST)</text>
  </g>
  <g>
    <rect class="card-lore" x="770" y="250" width="230" height="68"/>
    <text class="entity-title" x="885" y="279">entity_schemas</text>
    <text class="entity-sub" x="885" y="300">Мета-схемы классов</text>
  </g>
  <g>
    <rect class="card-chrono" x="1120" y="250" width="250" height="68"/>
    <text class="entity-title" x="1245" y="279">calendars</text>
    <text class="entity-sub" x="1245" y="300">Авторские календари и эры</text>
  </g>

  <!-- Row 3 -->
  <g>
    <rect class="card-hub" x="70" y="430" width="230" height="68"/>
    <rect class="card-hub-inner" x="74" y="434" width="222" height="60"/>
    <text class="entity-title" x="185" y="459">plot_promises</text>
    <text class="entity-sub" x="185" y="480">Сцены и сюжетные узлы</text>
  </g>
  <g>
    <rect class="card-manuscript" x="420" y="430" width="230" height="68"/>
    <text class="entity-title" x="535" y="459">text_blocks</text>
    <text class="entity-sub" x="535" y="480">Семантические блоки текста</text>
  </g>
  <g>
    <rect class="card-lore" x="770" y="430" width="230" height="68"/>
    <text class="entity-title" x="885" y="459">entities</text>
    <text class="entity-sub" x="885" y="480">Сущности лора (герои, локации)</text>
  </g>
  <g>
    <rect class="card-chrono" x="1120" y="430" width="250" height="68"/>
    <text class="entity-title" x="1245" y="459">timeline_events</text>
    <text class="entity-sub" x="1245" y="480">События хронологии (M_abs)</text>
  </g>

  <!-- =================================================================== -->
  <!-- LAYER 4: COMPACT 1-LINE LEGEND (DOMAINS + RELATION TYPES)           -->
  <!-- =================================================================== -->
  <g transform="translate(0, 650)">
    <line class="graph-edge" x1="48" y1="0" x2="96" y2="0" marker-end="url(#graph-arrow)"/>
    <text class="legend-text" x="104" y="4">Граф (TYPE RELATION)</text>

    <line class="rel-edge" x1="274" y1="0" x2="324" y2="0" marker-start="url(#one-start)" marker-end="url(#many-opt-end)"/>
    <text class="legend-text" x="332" y="4">Связь (1:N / 0..N)</text>

    <rect class="card-manuscript" x="478" y="-9" width="22" height="18"/>
    <text class="legend-text" x="506" y="4">Рукопись и сюжет</text>

    <rect class="card-hub" x="648" y="-9" width="22" height="18"/>
    <text class="legend-text" x="676" y="4">Центральный хаб (plot_promises)</text>

    <rect class="card-lore" x="900" y="-9" width="22" height="18"/>
    <text class="legend-text" x="928" y="4">Онтология и лор</text>

    <rect class="card-chrono" x="1062" y="-9" width="22" height="18"/>
    <text class="legend-text" x="1090" y="4">Время и космология</text>

    <rect class="card-project" x="1244" y="-9" width="22" height="18"/>
    <text class="legend-text" x="1272" y="4">Контекст (projects)</text>
  </g>
</svg>
