[package]
name = "worldwiki-e2e"
version = "0.85.0"
edition = "2024"

[lib]
name = "worldwiki_e2e"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
napi-build = "2"

[dependencies]
worldwiki-domain = { path = "../src-tauri/crates/worldwiki-domain" }
worldwiki-ports = { path = "../src-tauri/crates/worldwiki-ports" }
worldwiki-application = { path = "../src-tauri/crates/worldwiki-application" }
worldwiki-infrastructure = { path = "../src-tauri/crates/worldwiki-infrastructure", default-features = false }
worldwiki-tauri = { path = "../src-tauri/crates/worldwiki-tauri" }
world-wiki = { package = "world-wiki", path = "../src-tauri", default-features = false }

tauri = { version = "2", features = ["protocol-asset"] }
tauri-test = "0.2.1"
napi = { version = "2", default-features = false, features = ["napi8", "async", "serde-json"] }
napi-derive = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
surrealdb = { version = "3.3.0", features = ["kv-surrealkv", "kv-mem"] }
tokio = { version = "1.53.1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
