[package]
name = "evidence_miner"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
ureq = { version = "2.10", default-features = false, features = ["json", "native-tls", "gzip"] }
native-tls = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
urlencoding = "2.1"
