[build]
rustflags = ["--cfg", "surrealdb_unstable"]

[target.x86_64-pc-windows-msvc]
rustflags = ["--cfg", "surrealdb_unstable", "-C", "link-arg=/NODEFAULTLIB:libcmt.lib"]

[alias]
cov = 'llvm-cov --open --ignore-filename-regex=[\\/]src-tauri[\\/]src[\\/](main|lib)\.rs$ --ignore-filename-regex=[\\/]logic[\\/]schema\.rs$ --ignore-filename-regex=[\\/]tauri-surreal-kit[\\/]'
