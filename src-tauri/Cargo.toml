[package]
name = "world-wiki"
version = "0.85.0"
description = "A Tauri App"
authors = ["Danila"]
edition = "2021"

[package.metadata.cerberus]
layer = "tauri"

[workspace]
members = [
    ".",
    "crates/worldwiki-domain",
    "crates/worldwiki-ports",
    "crates/worldwiki-application",
    "crates/worldwiki-infrastructure",
    "crates/worldwiki-tauri",
]
resolver = "2"

[workspace.metadata.cerberus]
preset = "hexagonal-strict"

[workspace.metadata.cerberus.layers]
domain = { allowed_dependencies = [] }
ports = { allowed_dependencies = ["domain"] }
application = { allowed_dependencies = ["domain", "ports"] }
infrastructure = { allowed_dependencies = ["domain", "ports", "application"] }
adapter = { allowed_dependencies = ["domain", "ports", "application", "infrastructure"] }
tauri = { allowed_dependencies = ["domain", "ports", "application", "infrastructure"] }
cli = { allowed_dependencies = ["domain", "ports", "application", "infrastructure"] }


[lib]
name = "world_wiki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["ai-cloud", "ai-local"]
ai-cloud = ["dep:claw_runtime", "dep:claw_api"]
ai-local = ["ai-cloud", "dep:llama-sys"]
# Интеграционный тест AI-пайплайна (run_agent_loop + mock OpenAI SSE + реальная БД).
agent-pipeline = ["tauri/test"]

[dependencies]
worldwiki-domain = { path = "crates/worldwiki-domain" }
worldwiki-ports = { path = "crates/worldwiki-ports" }
worldwiki-application = { path = "crates/worldwiki-application" }
worldwiki-infrastructure = { path = "crates/worldwiki-infrastructure" }
worldwiki-tauri = { path = "crates/worldwiki-tauri" }

tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = { version = "12.0.1", features = ["serde-compat", "uuid-impl", "no-serde-warnings"] }
surrealdb = { version = "3.3.0", features = ["kv-surrealkv"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dashmap = "6.2.1"
scraper = "0.27.0"
surreal_domain = { path = "../tauri-surreal-kit/backend/surreal_domain/surreal_domain_facade" }
tauri-shell = { package = "tauri-shell-adapter", path = "../tauri-surreal-kit/backend/tauri_shell" }
tauri-plugin-window-state = "2.4.1"
zip = "8.6.0"
reqwest = { version = "0.13.4", features = ["json", "form"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "rt-multi-thread", "macros", "net", "time", "process", "io-std"] }
tauri-plugin-dialog = "2"

# AI Dependencies
claw_runtime = { package = "runtime", path = "../vendor/claw-code/rust/crates/runtime", optional = true }
claw_api = { package = "api", path = "../vendor/claw-code/rust/crates/api", optional = true }
llama-sys = { path = "llama-sys", optional = true }

[dev-dependencies]
mock-anthropic-service = { path = "../vendor/claw-code/rust/crates/mock-anthropic-service" }

[profile.dev]
debug = 1
split-debuginfo = "unpacked"
