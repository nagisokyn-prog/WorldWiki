[package]
name = "world-wiki"
version = "1.0.0"
description = "A Tauri App"
authors = ["Danila"]
edition = "2024"

[package.metadata.cerberus]
layer = "tauri"

[workspace]
members = [
    ".",
    "crates/worldwiki-calendar-core",
    "crates/worldwiki-calendar-wasm",
    "crates/worldwiki-document-core",
    "crates/worldwiki-ast-diff-wasm",
    "crates/worldwiki-manuscript-core",
    "crates/worldwiki-manuscript-wasm",
    "crates/worldwiki-domain",
    "crates/worldwiki-ports",
    "crates/worldwiki-application",
    "crates/worldwiki-infrastructure",
    "crates/worldwiki-ai",
    "crates/worldwiki-tauri",
]
resolver = "2"

[workspace.metadata.cerberus]
preset = "hexagonal-strict"

[workspace.metadata.cerberus.layers]
core = { allowed_dependencies = [] }
domain = { allowed_dependencies = ["core"] }
ports = { allowed_dependencies = ["domain", "core"] }
application = { allowed_dependencies = ["domain", "ports", "core"] }
infrastructure = { allowed_dependencies = ["domain", "ports", "application", "core"] }
adapter = { allowed_dependencies = ["domain", "ports", "application", "infrastructure", "core"] }
tauri = { allowed_dependencies = ["domain", "ports", "application", "infrastructure", "core"] }
cli = { allowed_dependencies = ["domain", "ports", "application", "infrastructure", "core"] }


[lib]
name = "world_wiki_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
ai = ["dep:worldwiki-ai", "worldwiki-tauri/ai"]
# Интеграционный тест AI-пайплайна (run_agent_loop + mock OpenAI SSE + реальная БД).
agent-pipeline = ["tauri/test"]

[dependencies]
worldwiki-domain = { path = "crates/worldwiki-domain" }
worldwiki-ports = { path = "crates/worldwiki-ports" }
worldwiki-application = { path = "crates/worldwiki-application" }
worldwiki-infrastructure = { path = "crates/worldwiki-infrastructure", default-features = false }
worldwiki-tauri = { path = "crates/worldwiki-tauri" }

tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-compat", "uuid-impl", "no-serde-warnings"] }
surrealdb = { version = "3", default-features = false, features = ["kv-surrealkv", "kv-mem"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
uuid = { version = "1", default-features = false, features = ["v4", "serde", "std"] }
dashmap = "6.2"
scraper = "0.29"
surreal_domain = { path = "../tauri-surreal-kit/backend/surreal_domain/surreal_domain_facade" }
tauri-shell = { package = "tauri-shell-adapter", path = "../tauri-surreal-kit/backend/tauri_shell" }
tauri-plugin-window-state = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "macros", "net", "time", "process", "io-std"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

# AI Dependencies (v0.60.0 separate crate)
worldwiki-ai = { path = "crates/worldwiki-ai", version = "0.60.0", optional = true }

[dev-dependencies]
mock-anthropic-service = { path = "../vendor/claw-code/rust/crates/mock-anthropic-service" }

[profile.dev]
debug = 0
strip = "debuginfo"
split-debuginfo = "unpacked"

[profile.dev.package.surrealdb]
opt-level = 2

[profile.dev.package.serde]
opt-level = 2

[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package.zip]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[profile.release.package.worldwiki-manuscript-wasm]
opt-level = "s"

[profile.release.package.worldwiki-ast-diff-wasm]
opt-level = "s"

[profile.release.package.worldwiki-calendar-wasm]
opt-level = "s"


