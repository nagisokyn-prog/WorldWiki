[package]
name = "worldwiki-calendar-core"
version = "0.85.0"
edition = "2024"
description = "Pure mathematical, no_std, formally verifiable calendar core for WorldWiki"

[package.metadata.cerberus]
layer = "core"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
kani = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unstable_features = "allow"
