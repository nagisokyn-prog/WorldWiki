[package]
name = "worldwiki-calendar-wasm"
version = "0.85.0"
edition = "2024"
description = "WebAssembly bindings for WorldWiki high-performance calendar engine"

[package.metadata.cerberus]
layer = "core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worldwiki-calendar-core = { path = "../worldwiki-calendar-core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
