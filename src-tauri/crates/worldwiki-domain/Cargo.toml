[package]
name = "worldwiki-domain"
version = "1.0.0"
edition = "2024"
description = "Domain model, entities, and business invariants for WorldWiki"
[package.metadata.cerberus]
layer = "domain"

[dependencies]

worldwiki-calendar-core = { path = "../worldwiki-calendar-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2.0"

[features]
default = []
kani = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unstable_features = "allow"

[dev-dependencies]
serde_json = "1.0"
