[package]
name = "worldwiki-domain"
version = "0.85.0"
edition = "2021"
description = "Domain model, entities, and business invariants for WorldWiki"
[package.metadata.arch-guard]
layer = "domain"

[dependencies]

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"
