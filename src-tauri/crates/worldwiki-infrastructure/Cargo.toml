[package]
name = "worldwiki-infrastructure"
version = "0.85.0"
edition = "2024"
description = "Driven Adapters for SurrealDB, llama.cpp, OpenXML, and FileSystem"
[package.metadata.cerberus]
layer = "infrastructure"

[dependencies]
worldwiki-domain = { path = "../worldwiki-domain" }
worldwiki-ports = { path = "../worldwiki-ports" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "fs"] }
dashmap = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
uuid = { version = "1", default-features = false, features = ["v4", "serde", "std"] }
surrealdb = { version = "3", default-features = false, features = ["kv-surrealkv", "kv-mem"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls-tls"] }
tracing = "0.1"

