[package]
name = "worldwiki-infrastructure"
version = "0.85.0"
edition = "2024"
description = "Driven Adapters for SurrealDB, llama.cpp, OpenXML, and FileSystem"
[package.metadata.cerberus]
layer = "infrastructure"

[dependencies]
worldwiki-domain = { path = "../worldwiki-domain" }
worldwiki-ports = { path = "../worldwiki-ports" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["sync", "time", "rt", "fs"] }
dashmap = "6.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
surrealdb = { version = "3.3.3", default-features = false, features = ["kv-surrealkv", "kv-mem"] }
zip = "8.6.0"
reqwest = { version = "0.13.5", features = ["json", "form"] }
tracing = "0.1"

claw_api = { package = "api", path = "../../../vendor/claw-code/rust/crates/api", optional = true }
llama-sys = { path = "../../llama-sys", optional = true }

[features]
default = ["ai-cloud"]
ai-cloud = ["dep:claw_api"]
ai-local = ["ai-cloud", "dep:llama-sys"]

