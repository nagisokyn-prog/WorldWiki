[package]
name = "worldwiki-manuscript-wasm"
version = "1.0.0"
edition = "2024"
description = "WebAssembly bindings for WorldWiki high-performance manuscript FSM entity extraction and cross-reference engine"

[package.metadata.cerberus]
layer = "core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worldwiki-manuscript-core = { path = "../worldwiki-manuscript-core", features = ["serde"] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
hashbrown = { version = "0.17.1", features = ["serde"] }

[dev-dependencies]
serde_json = "1.0"
wasm-bindgen-test = "0.3"
