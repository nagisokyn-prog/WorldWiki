[package]
name = "worldwiki-ports"
version = "0.1.0"
edition = "2021"
description = "Ports and interfaces (Secondary Ports) for WorldWiki architecture"

[dependencies]
worldwiki-domain = { path = "../worldwiki-domain" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["sync"] }
