[package]
name = "worldwiki-ports"
version = "1.0.0"
edition = "2024"
description = "Ports and interfaces (Secondary Ports) for WorldWiki architecture"
[package.metadata.cerberus]
layer = "ports"

[dependencies]

worldwiki-domain = { path = "../worldwiki-domain" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
