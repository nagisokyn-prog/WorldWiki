[package]
name = "worldwiki-tauri"
version = "0.1.0"
edition = "2021"
description = "Driving Adapter for Tauri v2 IPC, bridge macro, and AppState"

[dependencies]
worldwiki-domain = { path = "../worldwiki-domain" }
worldwiki-ports = { path = "../worldwiki-ports" }
worldwiki-application = { path = "../worldwiki-application" }
worldwiki-infrastructure = { path = "../worldwiki-infrastructure" }
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
surrealdb = { version = "3.2.4", default-features = false, features = ["kv-surrealkv", "kv-mem"] }
tokio = { version = "1", features = ["fs", "io-util", "time"] }
reqwest = { version = "0.13.4", features = ["json", "form"] }

