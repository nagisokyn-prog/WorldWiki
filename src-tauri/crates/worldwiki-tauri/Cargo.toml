[package]
name = "worldwiki-tauri"
version = "1.0.0"
edition = "2024"
description = "Driving Adapter for Tauri v2 IPC, bridge macro, and AppState"
[package.metadata.cerberus]
layer = "tauri"

[dependencies]

worldwiki-domain = { path = "../worldwiki-domain" }
worldwiki-ports = { path = "../worldwiki-ports" }
worldwiki-application = { path = "../worldwiki-application" }
worldwiki-infrastructure = { path = "../worldwiki-infrastructure", default-features = false }
worldwiki-ai = { path = "../worldwiki-ai", version = "0.60.0", optional = true }
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
surrealdb = { version = "3", default-features = false, features = ["kv-surrealkv", "kv-mem"] }
tokio = { version = "1", features = ["fs", "io-util", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }

[features]
default = []
ai = ["dep:worldwiki-ai"]

