<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Wiki - Loading</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .splash-container {
            text-align: center;
            max-width: 700px;
            padding: 20px;
        }
        
        /* ASCII Art Container */
        .ascii-art {
            font-family: 'Courier New', monospace;
            font-size: 8px;
            line-height: 10px;
            color: #8b5cf6;
            white-space: pre;
            margin-bottom: 20px;
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }
        
        .progress-container {
            background: #1a1a1a;
            border-radius: 8px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #06b6d4);
            border-radius: 8px;
            transition: width 0.3s ease;
            width: 0%;
        }
        
        .status-text {
            font-size: 13px;
            color: #888;
            min-height: 20px;
        }
        
        .perf-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .perf-badge.high { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .perf-badge.medium { background: rgba(234, 179, 8, 0.2); color: #eab308; }
        .perf-badge.low { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .perf-badge.visible { opacity: 1; }
        
        .perf-details {
            font-size: 11px;
            color: #555;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <!-- ASCII Art -->
        <div class="ascii-art" id="asciiArt"></div>
        
        <div class="subtitle">Загрузка мира...</div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status-text" id="statusText">Инициализация...</div>
        
        <div class="perf-badge" id="perfBadge">⚡ Производительность: ---</div>
        <div class="perf-details" id="perfDetails"></div>
    </div>

    <script>
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const perfBadge = document.getElementById('perfBadge');
        const perfDetails = document.getElementById('perfDetails');
        const asciiArt = document.getElementById('asciiArt');
        
        function setProgress(percent, text) {
            progressBar.style.width = percent + '%';
            statusText.textContent = text;
        }
        
        const worldAscii = `
 x=i+1;                                                      x=i+1;                                                                          float
  x=i+1;                                                    x=i+1;                                            x=arr[i]                       float
   x=i+1;                                                  x=i+1;                                               double                       float
    x=i+1;                                                x=i+1;                                                return                       float
     x=i+1;                 idx=arr[i];                  x=i+1;   idx=arr[i];idx=arr[i]  double  return;double; double                       float
      x=i+1;                x=i+1;x=i+1;                x=i+1;    idx=arr[i];idx=arr[i]  x=i+1; return;double;  return                       float
       x=i+1;              x=i+1;  x=i+1;              x=i+1;     return         return  x=i+1;return;          double                       float
        x=i+1;            x=i+1;    x=i+1;            x=i+1;      double         double  x=i+1;x=10;            return       idx=arr[i];idx=arr[i]
         x=i+1;          x=i+1;      x=i+1;          x=i+1;       return         return  return                 double       idx=arr[i];idx=arr[i]
          x=i+1;        x=i+1;        x=i+1;        x=i+1;        double         double  double                 return       double         double
           x=i+1;      x=i+1;          x=i+1;      x=i+1;         return         return  return                 double       return         return
            x=i+1;    x=i+1;            x=i+1;    x=i+1;          double         double  double                 return       double         double
             x=i+1;  x=i+1;              x=i+1;  x=i+1;           return         return  return                 double       return         return
              x=i+1;x=i+1;                x=i+1;x=i+1;            double         double  double                 return       double         double
               x=i+1;x=i+1;              x=i+1;x=i+1;             idx=arr[i];idx=arr[i]  return                 double       idx=arr[i];idx=arr[i]
                x=i+1;x=i+1;            x=i+1;x=i+1;              idx=arr[i];idx=arr[i]  double               id=compute();  idx=arr[i];idx=arr[i]
`;
        
        asciiArt.textContent = worldAscii;

        // Ждём готовности Tauri API — в dev-режиме он инициализируется асинхронно
        function waitForTauri(timeout) {
            timeout = timeout || 8000;
            return new Promise(function(resolve, reject) {
                if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
                    resolve(window.__TAURI__.core.invoke);
                    return;
                }
                var start = Date.now();
                var interval = setInterval(function() {
                    if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
                        clearInterval(interval);
                        resolve(window.__TAURI__.core.invoke);
                    } else if (Date.now() - start > timeout) {
                        clearInterval(interval);
                        reject(new Error('Tauri API не инициализирован за ' + timeout + 'мс'));
                    }
                }, 50);
            });
        }
        
        async function runStartup() {
            window.addEventListener('keydown', (e) => {
                if (e.code === 'F11') {
                    e.preventDefault();
                    if (window.__TAURI__) {
                        window.__TAURI__.core.invoke('toggle_fullscreen').catch(() => {});
                    }
                }
            }, true);
            try {
                setProgress(10, 'Подготовка базы данных...');
                await new Promise(function(r) { setTimeout(r, 300); });
                
                setProgress(30, 'Загрузка схем сущностей...');
                await new Promise(function(r) { setTimeout(r, 200); });
                
                setProgress(50, 'Запуск бенчмарка производительности...');

                // Ждём готовности Tauri API
                const invoke = await waitForTauri(8000);
                
                // Вызываем бенчмарк из Rust
                const perf = await invoke('run_performance_benchmark');
                
                setProgress(80, 'Бенчмарк: CPU ' + perf.cpu_score + 'ms, RAM ' + perf.memory_mb + 'ms, ' + perf.cores + ' ядер');
                await new Promise(function(r) { setTimeout(r, 300); });
                
                const levelNames = { low: '🐢 Низкая', medium: '⚡ Средняя', high: '🚀 Высокая' };
                const levelClasses = { low: 'low', medium: 'medium', high: 'high' };
                perfBadge.textContent = '⚡ Производительность: ' + (levelNames[perf.level] || '---');
                perfBadge.className = 'perf-badge visible ' + (levelClasses[perf.level] || 'medium');
                perfDetails.textContent = 'CPU: ' + perf.cpu_score + 'ms | Memory: ' + perf.memory_mb + 'ms | Cores: ' + perf.cores;
                
                setProgress(100, 'Готово! Загрузка приложения...');
                await new Promise(function(r) { setTimeout(r, 500); });
                
                localStorage.setItem('perfLevel', perf.level);
                localStorage.setItem('perfCpuScore', perf.cpu_score);
                localStorage.setItem('perfMemoryMb', perf.memory_mb);
                localStorage.setItem('perfCores', perf.cores);
                
                window.location.href = 'project_launcher.html';
                
            } catch (error) {
                console.error('Ошибка при запуске:', error);
                setProgress(100, 'Ошибка: ' + (error.message || String(error)));
                // Всё равно переходим дальше через 2 секунды
                await new Promise(function(r) { setTimeout(r, 2000); });
                window.location.href = 'project_launcher.html';
            }
        }
        
        runStartup();
    </script>
</body>
</html>
