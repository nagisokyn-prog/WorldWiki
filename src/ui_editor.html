<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Редактор сущности</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link href="css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/glass-theme.css">
    <link rel="stylesheet" href="css/new-ui-theme.css">
    <style>
        :root {
            --bg-window: #09090b;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg-window);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        #app {
            height: 100%;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.05) 0%, rgba(0, 0, 0, 0) 100%);
        }
        .window-header {
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-app-region: drag; /* Позволяет таскать окно за заголовок в Tauri */
        }
        .window-header button {
            -webkit-app-region: no-drag;
        }
        .entity-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .entity-type-badge {
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .entity-id-text {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            font-family: monospace;
        }
        .save-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .save-btn:hover {
            transform: translateY(-1px);
            background: var(--accent-hover);
        }
        .save-btn:active {
            transform: translateY(1px);
        }
        .save-btn.unsaved {
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(139, 92, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
        }
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="app" v-cloak>
        <div class="window-header">
            <div class="entity-info">
                <span class="entity-type-badge">{{ entityType }}</span>
                <span style="font-weight: 600; font-size: 15px;">{{ initialData?.name || 'Загрузка...' }}</span>
                <span class="entity-id-text">#{{ entityId }}</span>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <button class="btn-new btn-outline-new" style="background: rgba(245,166,35,0.1); color: #f5a623; border: 1px solid rgba(245,166,35,0.3); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold;" v-if="isPreviewingHistory" @click="exitHistoryPreview">
                    Вернуться к текущей
                </button>
                <button class="save-btn" :class="{ 'unsaved': isUnsaved }" @click="save" :style="{ opacity: isPreviewingHistory ? 0.5 : 1 }" :disabled="isPreviewingHistory">
                    <i class="fas fa-save"></i>
                    {{ isUnsaved ? 'Сохранить изменения' : 'Сохранено' }}
                </button>
                <button class="btn-new btn-outline-new" style="background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px; border-radius: 8px; cursor: pointer;" @click="toggleHistory" title="История изменений">
                    <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="16" width="16" xmlns="http://www.w3.org/2000/svg" style="display:inline;vertical-align:middle"><path d="M7 18m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path><path d="M7 6m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path><path d="M17 6m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path><path d="M7 8l0 8"></path><path d="M9 18h6a2 2 0 0 0 2 -2v-5"></path><path d="M14 14l3 -3l3 3"></path></svg>
                </button>
            </div>
        </div>
        
        <div v-if="isPreviewingHistory" style="background: rgba(245,166,35,0.1); border-bottom: 1px solid rgba(245,166,35,0.3); padding: 8px 24px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
            <span style="font-size: 11px; color: #f5a623; font-weight: bold;">⚠️ ВЫ ПРОСМАТРИВАЕТЕ СТАРУЮ ВЕРСИЮ</span>
            <div style="display: flex; gap: 8px;">
               <button class="btn-new btn-outline-new" style="font-size: 10px; border: 1px solid rgba(245,166,35,0.3); background: transparent; color: #f5a623; padding: 4px 8px; border-radius: 4px; cursor: pointer;" @click="exitHistoryPreview">Отмена</button>
               <button class="btn-new" style="font-size: 10px; background: #f5a623; color: #000; padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;" @click="restoreHistory">Восстановить эту версию</button>
            </div>
        </div>

        <div class="editor-container" style="flex-direction: row; padding: 0;">
            <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 20px;">
                <entity-editor-vue 
                    v-if="entityId && entityType && project && !isLoadingData"
                    :entity-id="entityId"
                    :entity-type="entityType"
                    :project="project"
                    :initial-data="previewData || initialData"
                    :key="previewKey"
                    ref="editorRef"
                    @modified="isUnsaved = true"
                    @saved="isUnsaved = false"
                ></entity-editor-vue>
                
                <div v-else-if="isLoadingData" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); gap: 16px;">
                    <i class="fas fa-spinner fa-spin" style="font-size: 24px;"></i>
                    <span>Загрузка данных...</span>
                </div>
            </div>

            <!-- RIGHT SIDEBAR (HISTORY) -->
            <aside v-if="showHistory" style="width: 280px; background: var(--bg-panel); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; box-shadow: -5px 0 20px rgba(0,0,0,0.2); z-index: 10;">
                <div style="padding: 16px; border-bottom: 1px solid var(--border-color); font-size: 12px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
                    <span>История изменений</span>
                    <button style="background: none; border: none; cursor: pointer; color: var(--text-muted);" @click="showHistory = false">✕</button>
                </div>
                
                <div v-if="isLoadingHistory" style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px;">
                    Загрузка истории...
                </div>
                <div v-else style="flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px;">
                    <div v-if="revisions.length === 0" style="font-size: 10px; color: var(--text-muted); text-align: center;">Нет сохраненных версий</div>
                    
                    <div v-for="rev in revisions" :key="rev.id" 
                         @click="previewHistory(rev)"
                         :style="{ background: previewingRevId === rev.id ? 'rgba(139,92,246,0.1)' : 'var(--bg-input)' }"
                         style="padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color); cursor: pointer; transition: all 0.2s;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                            <span style="font-size: 11px; font-weight: bold;">{{ new Date(rev.created_at).toLocaleString() }}</span>
                        </div>
                        <div v-if="previewingRevId === rev.id" style="margin-top: 8px;">
                            <span style="font-size: 9px; color: #f5a623;">Режим предпросмотра</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script type="module" src="/js/app/ui_editor.ts"></script>
</body>
</html>
