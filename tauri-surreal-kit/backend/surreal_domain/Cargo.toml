[workspace]
members = [
    "surreal_domain_core",
    "surreal_domain_macros",
    "surreal_domain_facade"
]
resolver = "2"

[workspace.metadata.cerberus]
preset = "hexagonal"

[workspace.metadata.cerberus.layers]
domain = { allowed_dependencies = [] }
ports = { allowed_dependencies = ["domain"] }
infrastructure = { allowed_dependencies = ["domain", "ports"] }
application = { allowed_dependencies = ["domain", "ports", "infrastructure"] }

[profile.dev]
debug = 0
strip = "debuginfo"
split-debuginfo = "unpacked"

[profile.dev.package.surrealdb]
opt-level = 2

[profile.dev.package.serde]
opt-level = 2

[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package.zip]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true


