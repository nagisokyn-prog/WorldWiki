[package]
name = "surreal_domain_core"
version = "0.85.0"
edition = "2024"

[package.metadata.cerberus]
layer = "infrastructure"

[dependencies]
surrealdb = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
ts-rs = { version = "12.0.1", features = ["serde-compat", "serde-json-impl", "uuid-impl", "chrono-impl", "no-serde-warnings"] }

[features]
default = []
kani = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unstable_features = "allow"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tempfile = "3.5"
uuid = { version = "1", features = ["v4"] }
