[package]
name = "surreal_domain_core"
version = "1.0.0"
edition = "2024"

[package.metadata.cerberus]
layer = "infrastructure"

[dependencies]
surrealdb = { version = "3", default-features = false, features = ["kv-surrealkv", "kv-mem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl", "uuid-impl", "chrono-impl", "no-serde-warnings"] }

[features]
default = []
kani = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unstable_features = "allow"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
uuid = { version = "1", default-features = false, features = ["v4", "serde", "std"] }
