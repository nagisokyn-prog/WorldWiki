[package]
name = "surreal_domain_core"
version = "0.1.0"
edition = "2021"

[dependencies]
surrealdb = "3.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["full"] }
ts-rs = { version = "12.0.1", features = ["serde-compat", "serde-json-impl", "uuid-impl", "chrono-impl", "no-serde-warnings"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tempfile = "3.5"
uuid = { version = "1", features = ["v4"] }
