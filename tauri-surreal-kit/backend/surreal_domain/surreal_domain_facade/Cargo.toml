[package]
name = "surreal_domain"
version = "0.1.0"
edition = "2021"

[dependencies]
surreal_domain_core = { path = "../surreal_domain_core" }
surreal_domain_macros = { path = "../surreal_domain_macros" }
ts-rs = { version = "12.0.1", features = ["serde-compat", "serde-json-impl", "uuid-impl", "chrono-impl", "no-serde-warnings"] }

[dev-dependencies]
surrealdb  = { version = "3.2.4", features = ["kv-surrealkv"] }
tokio      = { version = "1.53.1", features = ["full"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono     = { version = "0.4", features = ["serde"] }
tempfile   = "3"
tauri      = { version = "2.11.5", default-features = false, features = ["test"] }
ts-rs      = { version = "12.0.1", features = ["serde-compat", "serde-json-impl", "uuid-impl", "chrono-impl", "no-serde-warnings"] }


