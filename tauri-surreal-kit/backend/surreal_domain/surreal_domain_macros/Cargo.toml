[package]
name = "surreal_domain_macros"
version = "0.85.0"
edition = "2024"

[package.metadata.cerberus]
layer = "domain"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
