[package]
name = "tauri-shell-adapter"
version = "0.85.0"
description = "tauri-surreal-kit shell template — domain-agnostic Tauri + SurrealDB bootstrap adapter"
authors = []
edition = "2024"

[package.metadata.cerberus]
layer = "adapter"

[lib]
name = "tauri_shell"
path = "src/lib.rs"

[[bin]]
name = "tauri-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri      = { version = "2", default-features = false, features = ["protocol-asset", "test"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
surrealdb  = { version = "3", features = ["kv-surrealkv"] }
chrono     = { version = "0.4", features = ["serde"] }
uuid       = { version = "1.24.1", features = ["v4"] }
open       = "5.4.1"
thiserror  = "2.0"
tracing    = "0.1"


# Point to the local surreal_domain crate (adjust the path when using as a dependency)
surreal_domain = { path = "../surreal_domain/surreal_domain_facade" }

[dev-dependencies]
tempfile = "3.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
serial_test = "4.0.1"
