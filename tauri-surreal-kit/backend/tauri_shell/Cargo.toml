[package]
name = "tauri-shell-adapter"
version = "1.0.0"
description = "tauri-surreal-kit shell template — domain-agnostic Tauri + SurrealDB bootstrap adapter"
authors = []
edition = "2024"

[package.metadata.cerberus]
layer = "adapter"

[lib]
name = "tauri_shell"
path = "src/lib.rs"

[[bin]]
name = "tauri-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
wry = ["tauri/wry"]

[dependencies]
tauri      = { version = "2", default-features = false, features = ["protocol-asset"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
surrealdb  = { version = "3", default-features = false, features = ["kv-surrealkv"] }
chrono     = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
uuid       = { version = "1", default-features = false, features = ["v4", "serde", "std"] }
thiserror  = "2"
tracing    = "0.1"


# Point to the local surreal_domain crate (adjust the path when using as a dependency)
surreal_domain = { path = "../surreal_domain/surreal_domain_facade" }

[dev-dependencies]
tauri = { version = "2", default-features = false, features = ["test"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["v4", "serde", "std"] }
serial_test = "4"
